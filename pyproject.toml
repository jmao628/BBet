[project]
name = "bpmde"
version = "0.1.0"
description = "Basketball Prediction Market Decision Engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=0.20",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "rapidfuzz>=3.8",
    "nba_api>=1.4",
    "slack-sdk>=3.27",
    "streamlit>=1.33",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
